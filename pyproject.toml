[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kmeans"
version = "0.1.1"
description = "A toy implementation of KMeans clustering algorithm."
authors = [{ name = "Francisco", email = "francisco.sanchez.oliver@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools]
package-dir = {"" = "kmeans"}

[tool.setuptools.packages.find]
where = ["kmeans"]
